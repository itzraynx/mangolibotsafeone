<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mangoli Bot</title>
    <style>
        :root {
            --bg: #0d0f16;
            --panel: #181c2c;
            --panel-2: #1e2336;
            --border: #262c44;
            --text: #e7e9f2;
            --muted: #8b92ad;
            --accent: #8b5cf6;
            --red: #f87171;
            --green: #34d399;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .logo {
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            display: grid; place-items: center; font-size: 26px; margin: 0 auto 16px;
            color: #fff;
        }
        h1 { text-align: center; font-size: 20px; font-weight: 700; }
        p.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 24px; }
        label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        input[type="password"]:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%;
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        button:hover { background: #7c3aed; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .error {
            color: var(--red);
            font-size: 12px;
            text-align: center;
            min-height: 18px;
            margin-top: 12px;
        }
        .hint {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">◆</div>
        <h1>Mangoli Bot Dashboard</h1>
        <p class="sub">Enter the password to access the control panel</p>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" autofocus>
        <button id="submit">Sign In</button>
        <div class="error" id="error"></div>
        <div class="hint">⚡ by Nokiatis Community</div>
    </div>

    <script>
        const input = document.getElementById('password');
        const btn = document.getElementById('submit');
        const err = document.getElementById('error');

        async function doLogin() {
            const pw = input.value;
            if (!pw) { err.textContent = 'Enter a password.'; return; }
            btn.disabled = true;
            btn.textContent = 'Signing in…';
            err.textContent = '';
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw }),
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || 'Login failed.';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    input.value = '';
                    input.focus();
                }
            } catch (e) {
                err.textContent = 'Network error. Try again.';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        btn.addEventListener('click', doLogin);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
